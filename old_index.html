<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <title>BBS - BerkahBirdShop Klaten v4.0</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: #f4f7f2;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #a8d4a8;
        border-radius: 3px;
      }
      input,
      select,
      button,
      textarea {
        font-family: inherit;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ── RESPONSIVE ── */
      .bbs-app {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .bbs-sidebar {
        width: 188px;
        background: linear-gradient(180deg, #1b4d1b, #0e2e0e);
        color: #fff;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.3s ease;
      }
      .bbs-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .bbs-content {
        flex: 1;
        overflow: auto;
        padding: 20px 24px;
      }
      .bbs-hamburger {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #1a4a1a;
      }
      .bbs-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 90;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 20px;
      }
      .kasir-grid {
        display: grid;
        grid-template-columns: 1fr 330px;
        gap: 18px;
        align-items: start;
      }
      .prod-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
        gap: 10px;
      }
      .dash-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .rpt-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }
      .rpt-bot-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .sup-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
      }
      .excel-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .master-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .role-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      /* Tablet (≤ 1024px) */
      @media (max-width: 1024px) {
        .bbs-sidebar {
          width: 170px;
        }
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .kasir-grid {
          grid-template-columns: 1fr 300px;
        }
        .rpt-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Mobile (≤ 768px) */
      @media (max-width: 768px) {
        .bbs-app {
          position: relative;
        }
        .bbs-sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          z-index: 100;
          transform: translateX(-100%);
          width: 220px;
        }
        .bbs-sidebar.open {
          transform: translateX(0);
        }
        .bbs-overlay.open {
          display: block;
        }
        .bbs-hamburger {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 36px;
          height: 36px;
          border-radius: 8px;
          background: #f0f5f0;
        }
        .bbs-content {
          padding: 14px 16px;
        }
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .kasir-grid {
          grid-template-columns: 1fr;
        }
        .kasir-cart {
          position: fixed !important;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 50;
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
          max-height: 60vh;
          overflow-y: auto;
        }
        .kasir-cart-toggle {
          display: flex !important;
        }
        .dash-grid {
          grid-template-columns: 1fr;
        }
        .rpt-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .rpt-bot-grid {
          grid-template-columns: 1fr;
        }
        .sup-grid {
          grid-template-columns: 1fr;
        }
        .excel-grid {
          grid-template-columns: 1fr;
        }
        .role-grid {
          grid-template-columns: 1fr;
        }
        .master-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .hide-mobile {
          display: none !important;
        }
        .table-wrap {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
      }

      /* Small Mobile (≤ 480px) */
      @media (max-width: 480px) {
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
        }
        .master-grid {
          grid-template-columns: 1fr;
        }
        .bbs-content {
          padding: 12px;
        }
      }
    </style>
  </head>

      // ══════════════════════════════════════════════
      // HALAMAN LOGIN
      // ══════════════════════════════════════════════
      function LoginPage({ onLogin }) {
        const [username, setUsername] = useState("");
        const [password, setPassword] = useState("");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [showPass, setShowPass] = useState(false);

        const handleLogin = async (e) => {
          e.preventDefault();
          if (!username || !password) {
            setError("Username dan password wajib diisi!");
            return;
          }
          setLoading(true);
          setError("");
          try {
            const { data: rows, error: err } = await sb
              .from("users")
              .select("*")
              .eq("username", username.trim())
              .eq("status", "Aktif");
            if (err || !rows || rows.length === 0) {
              setError("Username atau password salah!");
              setLoading(false);
              return;
            }
            const data = rows.find((u) => u.password === password);
            if (!data) {
              setError("Username atau password salah!");
              setLoading(false);
              return;
            }
            sessionStorage.setItem("bbs_user", JSON.stringify(data));
            onLogin(data);
          } catch (e) {
            setError("Gagal login: " + e.message);
          }
          setLoading(false);
        };

        return (
          <div
            style={{
              minHeight: "100vh",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              background:

              overflow: "hidden",

          >

                height: 300,

                left: -80,
              }}
            />
            <div

                position: "absolute",
                width: 200,
                height: 200,
                borderRadius: "50%",
                background: "rgba(168,224,99,0.08)",
                top: "30%",
                left: "10%",
              }}
            />

            <div
              style={{
                background: "#fff",
                borderRadius: 20,
                padding: "40px 44px",
                width: 420,
                boxShadow: "0 30px 80px rgba(0,0,0,0.3)",

            >
              {/* Logo */}
              <div style={{ textAlign: "center", marginBottom: 32 }}>

                  }}
                >
                  🌿
                </div>
                <div
                  style={{
                    fontSize: 24,
                    fontWeight: 900,
                    color: "#1a4a1a",
                    letterSpacing: 0.5,
                  }}
                >
                  BerkahBirdShop
                </div>
                <div style={{ fontSize: 13, color: "#888", marginTop: 4 }}>
                  Klaten, Jawa Tengah
                </div>
                <div
                  style={{
                    width: 40,
                    height: 3,
                    background: "linear-gradient(90deg,#2d7a2d,#a8e063)",
                    borderRadius: 2,
                    margin: "12px auto 0",
                  }}
                />
              </div>

              <div
                style={{
                  fontSize: 14,
                  fontWeight: 700,
                  color: "#333",
                  marginBottom: 20,
                  textAlign: "center",
                }}
              >
                Masuk ke Sistem Manajemen
              </div>

              {error && (
                <div
                  style={{
                    background: "#fff5f5",

                    <button

                    >

                <button

      // ══════════════════════════════════════════════
      // HALAMAN KELOLA USER (hanya superadmin)
      // ══════════════════════════════════════════════
      function UsersPage({ sb, showNotif, currentUser, logActivity }) {
        const [users, setUsers] = useState([]);
        const [modal, setModal] = useState(null);
        const [form, setForm] = useState({
          username: "",
          password: "",
          nama: "",
          role: "pegawai",
          status: "Aktif",
        });
        const [loading, setLoading] = useState(false);

        const loadUsers = async () => {
          const { data } = await sb.from("users").select("*").order("id");
          setUsers(data || []);
        };
        useEffect(() => {
          loadUsers();
        }, []);

        const saveUser = async () => {
          if (!form.username || !form.password || !form.nama) {
            showNotif("Semua field wajib diisi!", "error");
            return;
          }
          setLoading(true);
          try {
            if (modal === "add") {
              const { error } = await sb.from("users").insert(form);
              if (error) throw error;
              if (logActivity)
                await logActivity(
                  "Tambah Akun",
                  "Akun",
                  `${form.nama} (${form.role})`,
                );
              showNotif("Akun berhasil ditambahkan!");
            } else {
              const oldUser = users.find((u) => u.id === modal.id);
              const { error } = await sb
                .from("users")
                .update(form)
                .eq("id", modal.id);
              if (error) throw error;
              const akunChanges = [];
              if (oldUser?.nama !== form.nama)
                akunChanges.push(`nama: "${oldUser?.nama}" → "${form.nama}"`);
              if (oldUser?.username !== form.username)
                akunChanges.push(
                  `username: ${oldUser?.username} → ${form.username}`,
                );
              if (oldUser?.role !== form.role)
                akunChanges.push(`role: ${oldUser?.role} → ${form.role}`);
              if (oldUser?.status !== form.status)
                akunChanges.push(`status: ${oldUser?.status} → ${form.status}`);
              if (oldUser?.password !== form.password)
                akunChanges.push(`password diubah`);
              const akunDetail =
                akunChanges.length > 0
                  ? `${form.nama}: ${akunChanges.join(", ")}`
                  : `${form.nama} (tidak ada perubahan)`;
              if (logActivity)
                await logActivity("Edit Akun", "Akun", akunDetail);
              showNotif("Akun berhasil diperbarui!");
            }
            await loadUsers();
            setModal(null);
          } catch (e) {
            showNotif("Error: " + e.message, "error");
          }
          setLoading(false);
        };

        const delUser = async (id) => {
          if (id === currentUser.id) {
            showNotif("Tidak bisa hapus akun sendiri!", "error");
            return;
          }
          if (!window.confirm("Hapus akun ini?")) return;
          const u = users.find((x) => x.id === id);
          await sb.from("users").delete().eq("id", id);
          if (logActivity)
            await logActivity("Hapus Akun", "Akun", u?.nama || "");
          await loadUsers();
          showNotif("Akun dihapus!");
        };

        const inp = {
          padding: "9px 12px",
          borderRadius: 8,
          border: "1px solid #cde4cd",
          fontSize: 13,
          outline: "none",
          background: "#fff",
          width: "100%",
          boxSizing: "border-box",
        };
        const btn = (v, extra = {}) => ({
          padding: "7px 15px",
          borderRadius: 8,
          cursor: "pointer",
          fontSize: 12,
          fontWeight: 700,
          border: "none",
          fontFamily: "inherit",
          ...extra,
          background:
            v === "primary"
              ? "#2d7a2d"
              : v === "danger"
                ? "#dc3545"
                : v === "outline"
                  ? "transparent"
                  : "#e8f0e8",
          color: ["primary", "danger"].includes(v)
            ? "#fff"
            : v === "outline"
              ? "#2d7a2d"
              : "#2d7a2d",
          border: v === "outline" ? "1.5px solid #2d7a2d" : "none",
        });

        return (
          <div>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                marginBottom: 16,
              }}
            >
              <span style={{ fontSize: 13, color: "#666" }}>
                {users.length} akun terdaftar
              </span>
              <button
                style={btn("primary")}
                onClick={() => {
                  setForm({
                    username: "",
                    password: "",
                    nama: "",
                    role: "pegawai",
                    status: "Aktif",
                  });
                  setModal("add");
                }}
              >
                + Tambah Akun
              </button>
            </div>

            <div
              style={{
                background: "#fff",
                borderRadius: 12,
                border: "1px solid #e4ede4",
                overflow: "auto",

            {/* Info hak akses */}
            <div style={{ marginTop: 20 }} className="role-grid">
              {[

      // ══════════════════════════════════════════════
      // MASTER DATA PAGE
      // ══════════════════════════════════════════════
      function MasterDataPage({
        sb,
        showNotif,
        kategoris,
        satuans,
        onReload,
        logActivity,
      }) {
        const [tab, setTab] = useState("kategori");
        const [modal, setModal] = useState(null);
        const [form, setForm] = useState({
          nama: "",
          warna_bg: "#e8f5e9",
          warna_text: "#2e7d32",
          keterangan: "",
        });

        const WARNA_PRESETS = [
          { bg: "#e8f5e9", c: "#2e7d32", label: "Hijau" },
          { bg: "#fff8e1", c: "#e65100", label: "Oranye" },
          { bg: "#e3f2fd", c: "#1565c0", label: "Biru" },
          { bg: "#fce4ec", c: "#c62828", label: "Merah" },
          { bg: "#f3e5f5", c: "#6a1b9a", label: "Ungu" },
          { bg: "#e0f2f1", c: "#00695c", label: "Teal" },
          { bg: "#fff3e0", c: "#e65100", label: "Amber" },
          { bg: "#e8eaf6", c: "#283593", label: "Indigo" },
          { bg: "#fafafa", c: "#424242", label: "Abu" },
        ];

        const saveKategori = async () => {
          if (!form.nama) {
            showNotif("Nama kategori wajib diisi!", "error");
            return;
          }
          try {
            if (modal === "add") {
              const { error } = await sb
                .from("kategoris")
                .insert({
                  nama: form.nama,
                  warna_bg: form.warna_bg,
                  warna_text: form.warna_text,
                });
              if (error) throw error;
              if (logActivity)
                await logActivity(
                  "Tambah Kategori",
                  "Master Data",
                  `Kategori: ${form.nama}`,
                );
              showNotif("Kategori ditambahkan!");
            } else {
              const oldKat = kategoris.find((k) => k.id === modal.id);
              const { error } = await sb
                .from("kategoris")
                .update({
                  nama: form.nama,
                  warna_bg: form.warna_bg,
                  warna_text: form.warna_text,
                })
                .eq("id", modal.id);
              if (error) throw error;
              const katChanges = [];
              if (oldKat?.nama !== form.nama)
                katChanges.push(`nama: "${oldKat?.nama}" → "${form.nama}"`);
              if (oldKat?.warna_bg !== form.warna_bg)
                katChanges.push(`warna diubah`);
              const katDetail =
                katChanges.length > 0
                  ? `${form.nama}: ${katChanges.join(", ")}`
                  : `${form.nama} (tidak ada perubahan)`;
              if (logActivity)
                await logActivity("Edit Kategori", "Master Data", katDetail);
              showNotif("Kategori diperbarui!");
            }
            await onReload();
            setModal(null);
          } catch (e) {
            showNotif("Error: " + e.message, "error");
          }
        };

        const delKategori = async (id) => {
          if (!window.confirm("Hapus kategori ini?")) return;
          const kat = kategoris.find((k) => k.id === id);
          const { error } = await sb.from("kategoris").delete().eq("id", id);
          if (error) {
            showNotif("Gagal hapus: " + error.message, "error");
            return;
          }
          if (logActivity)
            await logActivity(
              "Hapus Kategori",
              "Master Data",
              `Kategori: ${kat?.nama || ""}`,
            );
          await onReload();
          showNotif("Kategori dihapus!");
        };

        const saveSatuan = async () => {
          if (!form.nama) {
            showNotif("Nama satuan wajib diisi!", "error");
            return;
          }
          try {
            if (modal === "add") {
              const { error } = await sb
                .from("satuans")
                .insert({ nama: form.nama, keterangan: form.keterangan });
              if (error) throw error;
              if (logActivity)
                await logActivity(
                  "Tambah Satuan",
                  "Master Data",
                  `Satuan: ${form.nama}`,
                );
              showNotif("Satuan ditambahkan!");
            } else {
              const oldSat = satuans.find((s) => s.id === modal.id);
              const { error } = await sb
                .from("satuans")
                .update({ nama: form.nama, keterangan: form.keterangan })
                .eq("id", modal.id);
              if (error) throw error;
              const satChanges = [];
              if (oldSat?.nama !== form.nama)
                satChanges.push(`nama: "${oldSat?.nama}" → "${form.nama}"`);
              if (oldSat?.keterangan !== form.keterangan)
                satChanges.push(
                  `keterangan: "${oldSat?.keterangan}" → "${form.keterangan}"`,
                );
              const satDetail =
                satChanges.length > 0
                  ? `${form.nama}: ${satChanges.join(", ")}`
                  : `${form.nama} (tidak ada perubahan)`;
              if (logActivity)
                await logActivity("Edit Satuan", "Master Data", satDetail);
              showNotif("Satuan diperbarui!");
            }
            await onReload();
            setModal(null);
          } catch (e) {
            showNotif("Error: " + e.message, "error");
          }
        };

        const delSatuan = async (id) => {
          if (!window.confirm("Hapus satuan ini?")) return;
          const sat = satuans.find((s) => s.id === id);
          const { error } = await sb.from("satuans").delete().eq("id", id);
          if (error) {
            showNotif("Gagal hapus: " + error.message, "error");
            return;
          }
          if (logActivity)
            await logActivity(
              "Hapus Satuan",
              "Master Data",
              `Satuan: ${sat?.nama || ""}`,
            );
          await onReload();
          showNotif("Satuan dihapus!");
        };

        const inp = {
          padding: "9px 12px",
          borderRadius: 8,
          border: "1px solid #cde4cd",
          fontSize: 13,
          outline: "none",
          background: "#fff",
          width: "100%",
          boxSizing: "border-box",
        };
        const btn = (v, extra = {}) => ({
          padding: "7px 15px",
          borderRadius: 8,
          cursor: "pointer",
          fontSize: 12,
          fontWeight: 700,
          border: "none",
          fontFamily: "inherit",
          ...extra,
          background:
            v === "primary"
              ? "#2d7a2d"
              : v === "danger"
                ? "#dc3545"
                : v === "outline"
                  ? "transparent"
                  : "#e8f0e8",
          color: ["primary", "danger"].includes(v)
            ? "#fff"
            : v === "outline"
              ? "#2d7a2d"
              : "#2d7a2d",
          border: v === "outline" ? "1.5px solid #2d7a2d" : "none",
        });

        return (
          <div>
            {/* TAB */}
            <div
              style={{
                display: "flex",
                gap: 0,
                marginBottom: 20,
                background: "#fff",
                borderRadius: 12,
                padding: 6,
                border: "1px solid #e4ede4",
                width: "fit-content",
              }}
            >
              {[
                { id: "kategori", icon: "🏷️", label: "Kategori Produk" },
                { id: "satuan", icon: "⚖️", label: "Satuan" },
              ].map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  style={{
                    padding: "9px 20px",
                    borderRadius: 9,
                    border: "none",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 700,
                    background: tab === t.id ? "#2d7a2d" : "transparent",
                    color: tab === t.id ? "#fff" : "#666",
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                  }}
                >
                  {t.icon} {t.label}
                </button>
              ))}
            </div>

            {/* KATEGORI */}
            {tab === "kategori" && (
              <div>
                <div
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    marginBottom: 16,
                  }}
                >
                  <span style={{ fontSize: 13, color: "#666" }}>
                    {kategoris.length} kategori terdaftar
                  </span>
                  <button
                    style={btn("primary")}
                    onClick={() => {
                      setForm({
                        nama: "",
                        warna_bg: "#e8f5e9",
                        warna_text: "#2e7d32",
                        keterangan: "",
                      });
                      setModal("add");
                    }}
                  >
                    + Tambah Kategori
                  </button>
                </div>
                <div className="master-grid">
                  {kategoris.map((k) => (
                    <div
                      key={k.id}
                      style={{
                        background: "#fff",
                        borderRadius: 12,
                        padding: "16px 18px",
                        border: "1px solid #e4ede4",
                      }}
                    >
                      <div
                        style={{
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "space-between",
                          marginBottom: 12,
                        }}
                      >
                        <span
                          style={{
                            background: k.warna_bg,
                            color: k.warna_text,
                            padding: "5px 14px",
                            borderRadius: 20,
                            fontSize: 13,
                            fontWeight: 800,
                          }}
                        >
                          {k.nama}
                        </span>
                        <div
                          style={{
                            width: 28,
                            height: 28,
                            borderRadius: 8,
                            background: k.warna_bg,
                            border: `2px solid ${k.warna_text}`,
                            flexShrink: 0,
                          }}
                        />
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button
                          style={{
                            ...btn("outline"),
                            flex: 1,
                            padding: "5px 0",
                            fontSize: 11,
                          }}
                          onClick={() => {
                            setForm({
                              nama: k.nama,
                              warna_bg: k.warna_bg,
                              warna_text: k.warna_text,
                              keterangan: "",
                            });
                            setModal(k);
                          }}
                        >
                          ✏️ Edit
                        </button>
                        <button
                          style={{
                            ...btn("danger"),
                            flex: 1,
                            padding: "5px 0",
                            fontSize: 11,
                          }}
                          onClick={() => delKategori(k.id)}
                        >
                          🗑 Hapus
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {modal && (
                  <div
                    style={{
                      position: "fixed",
                      inset: 0,
                      background: "rgba(0,0,0,0.5)",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      zIndex: 999,
                    }}
                    onClick={() => setModal(null)}
                  >
                    <div
                      style={{
                        background: "#fff",
                        borderRadius: 16,
                        padding: 24,
                        width: 420,
                        boxShadow: "0 20px 60px rgba(0,0,0,0.2)",
                      }}
                      onClick={(e) => e.stopPropagation()}
                    >
                      <div
                        style={{
                          fontSize: 16,
                          fontWeight: 800,
                          marginBottom: 18,
                          color: "#1a4a1a",
                        }}
                      >
                        {modal === "add"
                          ? "➕ Tambah Kategori"
                          : "✏️ Edit Kategori"}
                      </div>
                      <div style={{ marginBottom: 16 }}>
                        <label
                          style={{
                            display: "block",
                            fontSize: 11,
                            fontWeight: 800,
                            color: "#555",
                            marginBottom: 5,
                          }}
                        >
                          Nama Kategori *
                        </label>
                        <input
                          style={inp}
                          placeholder="Contoh: Pakan Burung..."
                          value={form.nama}
                          onChange={(e) =>
                            setForm((f) => ({ ...f, nama: e.target.value }))
                          }
                        />
                      </div>
                      <div style={{ marginBottom: 16 }}>
                        <label
                          style={{
                            display: "block",
                            fontSize: 11,
                            fontWeight: 800,
                            color: "#555",
                            marginBottom: 8,
                          }}
                        >
                          Pilih Warna
                        </label>
                        <div
                          style={{
                            display: "grid",
                            gridTemplateColumns: "repeat(3,1fr)",
                            gap: 8,
                          }}
                        >
                          {WARNA_PRESETS.map((w, i) => (
                            <div
                              key={i}
                              onClick={() =>
                                setForm((f) => ({
                                  ...f,
                                  warna_bg: w.bg,
                                  warna_text: w.c,
                                }))
                              }
                              style={{
                                background: w.bg,
                                borderRadius: 8,
                                padding: "10px",
                                textAlign: "center",
                                cursor: "pointer",
                                border:
                                  form.warna_bg === w.bg
                                    ? `3px solid ${w.c}`
                                    : "2px solid transparent",
                                transition: "border 0.1s",
                              }}
                            >
                              <span
                                style={{
                                  color: w.c,
                                  fontWeight: 800,
                                  fontSize: 12,
                                }}
                              >
                                {w.label}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div
                        style={{
                          marginBottom: 18,
                          padding: "12px 14px",
                          background: "#f8fdf8",
                          borderRadius: 10,
                          border: "1px solid #e4ede4",
                        }}
                      >
                        <div
                          style={{
                            fontSize: 11,
                            color: "#888",
                            marginBottom: 6,
                          }}
                        >
                          Preview:
                        </div>
                        <span
                          style={{
                            background: form.warna_bg,
                            color: form.warna_text,
                            padding: "5px 16px",
                            borderRadius: 20,
                            fontSize: 13,
                            fontWeight: 800,
                          }}
                        >
                          {form.nama || "Nama Kategori"}
                        </span>

      // ══════════════════════════════════════════════
      // APLIKASI UTAMA
      // ══════════════════════════════════════════════
      function App() {
        const [currentUser, setCurrentUser] = useState(() => {
          try {
            const s = sessionStorage.getItem("bbs_user");
            return s ? JSON.parse(s) : null;
          } catch {
            return null;
          }
        });

        const handleLogin = (user) => {
          setCurrentUser(user);
        };
        const handleLogout = () => {
          sessionStorage.removeItem("bbs_user");
          setCurrentUser(null);
        };

        if (!currentUser) return <LoginPage onLogin={handleLogin} />;
        return <Main currentUser={currentUser} onLogout={handleLogout} />;
      }

      function Main({ currentUser, onLogout }) {
        const isSuperAdmin = currentUser.role === "superadmin";
        const allowedPages = ACCESS[currentUser.role] || ACCESS.pegawai;

        const [page, setPage] = useState(allowedPages[0]);
        const [products, setProducts] = useState([]);
        const [transactions, setTransactions] = useState([]);
        const [suppliers, setSuppliers] = useState([]);
        const [kategoris, setKategoris] = useState([]);
        const [satuans, setSatuans] = useState([]);
        const [activityLogs, setActivityLogs] = useState([]);
        const [loading, setLoading] = useState(true);
        const [cart, setCart] = useState([]);
        const [searchProd, setSearchProd] = useState("");
        const [filterCat, setFilterCat] = useState("Semua");
        const [customerName, setCustomerName] = useState("");
        const [paymentInput, setPaymentInput] = useState("");
        const [receipt, setReceipt] = useState(null);
        const [prodModal, setProdModal] = useState(null);
        const [prodForm, setProdForm] = useState({
          name: "",
          category: "Pakan Jadi",
          unit: "kg",
          price: "",
          stock: "",
          min_stock: "",
          supplier_id: "",
        });
        const [histSearch, setHistSearch] = useState("");
        const [filterDate, setFilterDate] = useState("");
        const [restockModal, setRestockModal] = useState(null);
        const [restockQty, setRestockQty] = useState("");
        const [notif, setNotif] = useState(null);
        const [supModal, setSupModal] = useState(null);
        const [supForm, setSupForm] = useState({
          name: "",
          contact: "",
          phone: "",
          email: "",
          address: "",
          category: "",
          status: "Aktif",
          notes: "",
        });
        const [rptMonth, setRptMonth] = useState(new Date().getMonth());
        const [rptYear, setRptYear] = useState(new Date().getFullYear());
        const [importLog, setImportLog] = useState([]);
        const [showLogout, setShowLogout] = useState(false);
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const fileRef = useRef();

        const showNotif = (msg, type = "success") => {
          setNotif({ msg, type });
          setTimeout(() => setNotif(null), 3200);
        };

        const logActivity = async (aksi, kategori, detail = "") => {
          try {
            await sb.from("activity_logs").insert({
              user_nama: currentUser.nama,
              user_role: currentUser.role,
              aksi,
              kategori,
              detail,
            });
          } catch (e) {
            console.error("Log error:", e);
          }
        };

        const loadAll = useCallback(async () => {
          setLoading(true);
          try {
            const [
              { data: prods },
              { data: sups },
              { data: trxs },
              { data: items },
              { data: kats },
              { data: sats },
              { data: acts },
            ] = await Promise.all([
              sb.from("products").select("*").order("name"),
              sb.from("suppliers").select("*").order("name"),
              sb
                .from("transactions")
                .select("*")
                .order("date", { ascending: false })
                .order("id", { ascending: false }),
              sb.from("transaction_items").select("*"),
              sb.from("kategoris").select("*").order("nama"),
              sb.from("satuans").select("*").order("nama"),
              sb
                .from("activity_logs")
                .select("*")
                .order("created_at", { ascending: false })
                .limit(30),
            ]);
            setProducts(prods || []);
            setSuppliers(sups || []);
            setKategoris(kats || []);
            setSatuans(sats || []);
            setActivityLogs(acts || []);
            setTransactions(
              (trxs || []).map((t) => ({
                ...t,
                items: (items || []).filter((i) => i.transaction_id === t.id),
              })),
            );
          } catch (e) {
            showNotif("Gagal load: " + e.message, "error");
          }
          setLoading(false);
        }, []);

        useEffect(() => {
          loadAll();
        }, [loadAll]);

        const todayTrx = transactions.filter((t) => t.date === TODAY);
        const todayRev = todayTrx.reduce((s, t) => s + t.total, 0);
        const weekStart = new Date(Date.now() - 7 * 86400000)
          .toISOString()
          .slice(0, 10);
        const weekTrx = transactions.filter((t) => t.date >= weekStart);
        const weekRev = weekTrx.reduce((s, t) => s + t.total, 0);
        const lowStock = products.filter((p) => p.stock <= p.min_stock);

        const filtProd = useMemo(
          () =>
            products.filter((p) => {
              const mc = filterCat === "Semua" || p.category === filterCat;
              const ms = p.name
                .toLowerCase()
                .includes(searchProd.toLowerCase());
              return mc && ms;
            }),
          [products, filterCat, searchProd],
        );

        const cartTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
        const payNum = parseInt(paymentInput) || 0;
        const change = payNum - cartTotal;

        const addToCart = (prod) => {
          if (prod.stock <= 0) {
            showNotif("Stok habis!", "error");
            return;
          }
          setCart((c) => {
            const ex = c.find((x) => x.product_id === prod.id);
            if (ex) {
              if (ex.qty >= prod.stock) {
                showNotif("Stok tidak mencukupi!", "error");
                return c;
              }
              return c.map((x) =>
                x.product_id === prod.id ? { ...x, qty: x.qty + 1 } : x,
              );
            }
            return [
              ...c,
              {
                product_id: prod.id,
                name: prod.name,
                price: prod.price,
                unit: prod.unit,
                qty: 1,
              },
            ];
          });
        };
        const updCart = (pid, qty) => {
          if (qty <= 0) {
            setCart((c) => c.filter((x) => x.product_id !== pid));
            return;
          }
          const p = products.find((p) => p.id === pid);
          if (qty > p.stock) {
            showNotif("Stok tidak mencukupi!", "error");
            return;
          }
          setCart((c) =>
            c.map((x) => (x.product_id === pid ? { ...x, qty } : x)),
          );
        };
        const processPayment = async () => {
          if (!cart.length) {
            showNotif("Keranjang kosong!", "error");
            return;
          }
          if (change < 0) {
            showNotif("Pembayaran kurang!", "error");
            return;
          }
          if (payNum <= 0) {
            showNotif("Masukkan nominal pembayaran!", "error");
            return;
          }
          setLoading(true);
          try {
            const trxCode = `TRX${String(transactions.length + 1).padStart(4, "0")}`;
            const { data: trx, error: e1 } = await sb
              .from("transactions")
              .insert({
                trx_code: trxCode,
                date: TODAY,
                customer: customerName || "Umum",
                total: cartTotal,
                payment: payNum,
                change_amt: change,
              })
              .select()
              .single();
            if (e1) throw e1;
            const { error: e2 } = await sb
              .from("transaction_items")
              .insert(
                cart.map((i) => ({
                  transaction_id: trx.id,
                  product_id: i.product_id,
                  product_name: i.name,
                  qty: i.qty,
                  unit: i.unit,
                  price: i.price,
                })),
              );
            if (e2) throw e2;
            for (const i of cart) {
              const p = products.find((x) => x.id === i.product_id);
              await sb
                .from("products")
                .update({ stock: p.stock - i.qty })
                .eq("id", i.product_id);
            }
            await loadAll();
            setReceipt({
              ...trx,
              items: cart.map((i) => ({
                product_name: i.name,
                qty: i.qty,
                unit: i.unit,
                price: i.price,
              })),
            });
            setCart([]);
            setCustomerName("");
            setPaymentInput("");
            await logActivity(
              "Transaksi Baru",
              "Kasir",
              `${trxCode} - ${customerName || "Umum"} - ${new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", minimumFractionDigits: 0 }).format(cartTotal)}`,
            );
            showNotif("Transaksi berhasil!");
          } catch (e) {
            showNotif("Gagal: " + e.message, "error");
          }
          setLoading(false);
        };
        const saveProd = async () => {
          if (!prodForm.name || !prodForm.price || !prodForm.stock) {
            showNotif("Lengkapi semua field!", "error");
            return;
          }
          setLoading(true);
          const payload = {
            name: prodForm.name,
            category: prodForm.category,
            unit: prodForm.unit,
            price: parseInt(prodForm.price),
            stock: parseInt(prodForm.stock),
            min_stock: parseInt(prodForm.min_stock) || 5,
            supplier_id: prodForm.supplier_id
              ? parseInt(prodForm.supplier_id)
              : null,
          };
          try {
            if (prodModal === "add") {
              await sb.from("products").insert(payload);
              await logActivity(
                "Tambah Produk",
                "Produk",
                `${prodForm.name} - ${new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", minimumFractionDigits: 0 }).format(parseInt(prodForm.price))}`,
              );
              showNotif("Produk ditambahkan!");
            } else {
              await sb.from("products").update(payload).eq("id", prodModal.id);
              const fmtRp = (n) =>
                new Intl.NumberFormat("id-ID", {
                  style: "currency",
                  currency: "IDR",
                  minimumFractionDigits: 0,
                }).format(n);
              const changes = [];
              if (prodModal.name !== prodForm.name)
                changes.push(`nama: "${prodModal.name}" → "${prodForm.name}"`);
              if (String(prodModal.price) !== String(prodForm.price))
                changes.push(
                  `harga: ${fmtRp(prodModal.price)} → ${fmtRp(parseInt(prodForm.price))}`,
                );
              if (prodModal.category !== prodForm.category)
                changes.push(
                  `kategori: ${prodModal.category} → ${prodForm.category}`,
                );
              if (prodModal.unit !== prodForm.unit)
                changes.push(`satuan: ${prodModal.unit} → ${prodForm.unit}`);
              if (String(prodModal.stock) !== String(prodForm.stock))
                changes.push(`stok: ${prodModal.stock} → ${prodForm.stock}`);
              if (String(prodModal.min_stock) !== String(prodForm.min_stock))
                changes.push(
                  `min stok: ${prodModal.min_stock} → ${prodForm.min_stock}`,
                );
              const detail =
                changes.length > 0
                  ? `${prodForm.name}: ${changes.join(", ")}`
                  : `${prodForm.name} (tidak ada perubahan)`;
              await logActivity("Edit Produk", "Produk", detail);
              showNotif("Produk diperbarui!");
            }
            await loadAll();
          } catch (e) {
            showNotif("Error: " + e.message, "error");
          }
          setProdModal(null);
          setLoading(false);
        };
        const delProd = async (id) => {
          if (!window.confirm("Hapus produk ini?")) return;
          const p = products.find((x) => x.id === id);
          await sb.from("products").delete().eq("id", id);
          await logActivity("Hapus Produk", "Produk", p?.name || "");
          await loadAll();
          showNotif("Produk dihapus!");
        };
        const doRestock = async () => {
          if (!restockQty || parseInt(restockQty) <= 0) {
            showNotif("Masukkan jumlah valid!", "error");
            return;
          }
          const p = products.find((x) => x.id === restockModal.id);
          await sb
            .from("products")
            .update({ stock: p.stock + parseInt(restockQty) })
            .eq("id", restockModal.id);
          await logActivity(
            "Restock Stok",
            "Stok",
            `${restockModal.name} +${restockQty} ${restockModal.unit} (${p.stock} → ${p.stock + parseInt(restockQty)})`,
          );
          await loadAll();
          showNotif(`Restock ${restockModal.name} berhasil!`);
          setRestockModal(null);
          setRestockQty("");
        };
        const saveSup = async () => {
          if (!supForm.name || !supForm.phone) {
            showNotif("Nama & Telepon wajib!", "error");
            return;
          }
          setLoading(true);
          try {
            if (supModal === "add") {
              await sb.from("suppliers").insert(supForm);
              await logActivity("Tambah Supplier", "Supplier", supForm.name);
              showNotif("Supplier ditambahkan!");
            } else {
              const oldSup = suppliers.find((s) => s.id === supModal.id);
              await sb.from("suppliers").update(supForm).eq("id", supModal.id);
              const supChanges = [];
              if (oldSup?.name !== supForm.name)
                supChanges.push(`nama: "${oldSup?.name}" → "${supForm.name}"`);
              if (oldSup?.phone !== supForm.phone)
                supChanges.push(`telepon: ${oldSup?.phone} → ${supForm.phone}`);
              if (oldSup?.contact !== supForm.contact)
                supChanges.push(`PIC: ${oldSup?.contact} → ${supForm.contact}`);
              if (oldSup?.status !== supForm.status)
                supChanges.push(
                  `status: ${oldSup?.status} → ${supForm.status}`,
                );
              const supDetail =
                supChanges.length > 0
                  ? `${supForm.name}: ${supChanges.join(", ")}`
                  : `${supForm.name} (tidak ada perubahan)`;
              await logActivity("Edit Supplier", "Supplier", supDetail);
              showNotif("Supplier diperbarui!");
            }
            await loadAll();
          } catch (e) {
            showNotif("Error: " + e.message, "error");
          }
          setSupModal(null);
          setLoading(false);
        };
        const delSup = async (id) => {
          if (!window.confirm("Hapus supplier?")) return;
          const sup = suppliers.find((x) => x.id === id);
          await sb.from("suppliers").delete().eq("id", id);
          await logActivity("Hapus Supplier", "Supplier", sup?.name || "");
          await loadAll();
          showNotif("Supplier dihapus!");
        };

        const rptTrx = transactions.filter((t) => {
          const [y, m] = t.date.split("-").map(Number);
          return y === rptYear && m === rptMonth + 1;
        });
        const rptRev = rptTrx.reduce((s, t) => s + t.total, 0);
        const daysInMonth = new Date(rptYear, rptMonth + 1, 0).getDate();
        const dayData = Array.from({ length: daysInMonth }, (_, i) => {
          const ds = `${rptYear}-${String(rptMonth + 1).padStart(2, "0")}-${String(i + 1).padStart(2, "0")}`;
          const tt = rptTrx.filter((t) => t.date === ds);
          return { day: i + 1, rev: tt.reduce((s, t) => s + t.total, 0) };
        });
        const maxDayRev = Math.max(...dayData.map((d) => d.rev), 1);
        const catData = CATS.filter((c) => c !== "Semua")
          .map((cat) => {
            let rev = 0;
            rptTrx.forEach((t) =>
              (t.items || []).forEach((i) => {
                const p = products.find((pr) => pr.id === i.product_id);
                if (p && p.category === cat) rev += i.price * i.qty;
              }),
            );

                  const ex = products.find(
                    (p) =>
                      p.name.toLowerCase() ===
                      String(r["Nama Produk"]).toLowerCase(),
                  );
                  const payload = {
                    name: String(r["Nama Produk"]),
                    category: r["Kategori"] || "Pakan Jadi",
                    unit: r["Satuan"] || "pcs",
                    price: parseInt(r["Harga"]) || 0,
                    stock: parseInt(r["Stok"]) || 0,
                    min_stock: parseInt(r["Min Stok"]) || 5,
                  };
                  if (ex) {
                    await sb.from("products").update(payload).eq("id", ex.id);
                    updated++;
                  } else {
                    await sb.from("products").insert(payload);
                    added++;
                  }

                logs.push(

                  >
                    Terima kasih sudah berbelanja! 🌿
                  </div>
                  <button
                    style={{
                      ...btn("primary"),
                      width: "100%",
                      marginTop: 12,
                      padding: "11px",
                      borderRadius: 10,
                      fontSize: 14,
                    }}
                    onClick={() => setReceipt(null)}
                  >
                    ✅ Tutup Struk
                  </button>
                </div>
              </div>
            )}

            {/* MODAL PRODUK */}
            {prodModal && (
              <div style={S.overlay} onClick={() => setProdModal(null)}>
                <div style={S.modal} onClick={(e) => e.stopPropagation()}>
                  <div
                    style={{
                      fontSize: 16,
                      fontWeight: 800,
                      marginBottom: 18,
                      color: "#1a4a1a",
                    }}
                  >
                    {prodModal === "add"
                      ? "➕ Tambah Produk"
                      : "✏️ Edit Produk"}
                  </div>
                  {[
                    { l: "Nama *", k: "name", t: "text", p: "Nama produk..." },
                    { l: "Harga *", k: "price", t: "number", p: "Harga..." },
                    { l: "Stok *", k: "stock", t: "number", p: "Stok..." },
                    {
                      l: "Min Stok",
                      k: "min_stock",
                      t: "number",
                      p: "Min stok...",
                    },
                  ].map((f) => (
                    <div key={f.k} style={{ marginBottom: 12 }}>
                      <label
                        style={{
                          display: "block",
                          fontSize: 11,
                          fontWeight: 800,
                          color: "#555",
                          marginBottom: 4,
                        }}
                      >
                        {f.l}
                      </label>
                      <input
                        style={S.inp}
                        type={f.t}
                        placeholder={f.p}
                        value={prodForm[f.k]}
                        onChange={(e) =>
                          setProdForm((p) => ({ ...p, [f.k]: e.target.value }))
                        }
                      />
                    </div>
                  ))}
                  <div style={{ marginBottom: 12 }}>
                    <label
                      style={{
                        display: "block",
                        fontSize: 11,
                        fontWeight: 800,
                        color: "#555",
                        marginBottom: 4,
                      }}
                    >
                      Kategori
                    </label>
                    <select
                      style={S.inp}
                      value={prodForm.category}
                      onChange={(e) =>
                        setProdForm((p) => ({ ...p, category: e.target.value }))
                      }
                    >
                      {kategoris.map((k) => (
                        <option key={k.id} value={k.nama}>
                          {k.nama}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div style={{ marginBottom: 12 }}>
                    <label
                      style={{
                        display: "block",
                        fontSize: 11,
                        fontWeight: 800,
                        color: "#555",
                        marginBottom: 4,
                      }}
                    >
                      Satuan
                    </label>
                    <select
                      style={S.inp}
                      value={prodForm.unit}
                      onChange={(e) =>
                        setProdForm((p) => ({ ...p, unit: e.target.value }))
                      }
                    >
                      {satuans.map((s) => (
                        <option key={s.id} value={s.nama}>
                          {s.nama}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div style={{ marginBottom: 20 }}>
                    <label
                      style={{
                        display: "block",
                        fontSize: 11,
                        fontWeight: 800,
                        color: "#555",
                        marginBottom: 4,
                      }}
                    >
                      Supplier
                    </label>
                    <select
                      style={S.inp}
                      value={prodForm.supplier_id}
                      onChange={(e) =>
                        setProdForm((p) => ({
                          ...p,
                          supplier_id: e.target.value,
                        }))
                      }
                    >
                      <option value="">— Pilih Supplier —</option>
                      {suppliers.map((s) => (
                        <option key={s.id} value={s.id}>
                          {s.name}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button
                      style={{
                        ...btn("primary"),
                        flex: 1,
                        padding: 12,
                        fontSize: 14,
                      }}
                      onClick={saveProd}
                    >
                      💾 Simpan
                    </button>
                    <button
                      style={{ ...btn(), flex: 1, padding: 12, fontSize: 14 }}
                      onClick={() => setProdModal(null)}
                    >
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL SUPPLIER */}
            {supModal && (
              <div style={S.overlay} onClick={() => setSupModal(null)}>
                <div style={S.modal} onClick={(e) => e.stopPropagation()}>
                  <div
                    style={{
                      fontSize: 16,
                      fontWeight: 800,
                      marginBottom: 18,
                      color: "#1a4a1a",
                    }}
                  >
                    {supModal === "add"
                      ? "➕ Tambah Supplier"
                      : "✏️ Edit Supplier"}
                  </div>
                  {[
                    {
                      l: "Nama *",
                      k: "name",
                      t: "text",
                      p: "Nama supplier...",
                    },
                    {
                      l: "Kontak PIC",
                      k: "contact",
                      t: "text",
                      p: "Nama PIC...",
                    },
                    { l: "Telepon *", k: "phone", t: "text", p: "08xx..." },
                    { l: "Email", k: "email", t: "email", p: "email@..." },
                    { l: "Alamat", k: "address", t: "text", p: "Jl. ..." },
                    {
                      l: "Kategori",
                      k: "category",
                      t: "text",
                      p: "Jenis produk...",
                    },
                  ].map((f) => (
                    <div key={f.k} style={{ marginBottom: 12 }}>
                      <label
                        style={{
                          display: "block",
                          fontSize: 11,
                          fontWeight: 800,
                          color: "#555",
                          marginBottom: 4,
                        }}
                      >
                        {f.l}
                      </label>
                      <input
                        style={S.inp}
                        type={f.t}
                        placeholder={f.p}
                        value={supForm[f.k]}
                        onChange={(e) =>
                          setSupForm((s) => ({ ...s, [f.k]: e.target.value }))
                        }
                      />
                    </div>
                  ))}
                  <div style={{ marginBottom: 12 }}>
                    <label
                      style={{
                        display: "block",
                        fontSize: 11,
                        fontWeight: 800,
                        color: "#555",
                        marginBottom: 4,
                      }}
                    >
                      Status
                    </label>
                    <select
                      style={S.inp}
                      value={supForm.status}
                      onChange={(e) =>
                        setSupForm((s) => ({ ...s, status: e.target.value }))
                      }
                    >
                      <option>Aktif</option>
                      <option>Tidak Aktif</option>
                    </select>
                  </div>
                  <div style={{ marginBottom: 20 }}>
                    <label
                      style={{
                        display: "block",
                        fontSize: 11,
                        fontWeight: 800,
                        color: "#555",
                        marginBottom: 4,
                      }}
                    >
                      Catatan
                    </label>
                    <textarea
                      style={{ ...S.inp, height: 76, resize: "vertical" }}
                      placeholder="Catatan..."
                      value={supForm.notes}
                      onChange={(e) =>
                        setSupForm((s) => ({ ...s, notes: e.target.value }))
                      }
                    />
                  </div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button
                      style={{
                        ...btn("primary"),
                        flex: 1,
                        padding: 12,
                        fontSize: 14,
                      }}
                      onClick={saveSup}
                    >
                      💾 Simpan
                    </button>
                    <button
                      style={{ ...btn(), flex: 1, padding: 12, fontSize: 14 }}
                      onClick={() => setSupModal(null)}
                    >
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL RESTOCK */}
            {restockModal && (
              <div style={S.overlay} onClick={() => setRestockModal(null)}>
                <div
                  style={{ ...S.modal, width: 330 }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div
                    style={{
                      fontSize: 16,
                      fontWeight: 800,
                      marginBottom: 4,
                      color: "#1a4a1a",
                    }}
                  >
                    📦 Restock Produk
                  </div>
                  <div
                    style={{
                      fontSize: 13,
                      color: "#666",
                      marginBottom: 14,
                      fontWeight: 600,
                    }}
                  >
                    {restockModal.name}
                  </div>
                  <div
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontSize: 13,
                      marginBottom: 14,
                      padding: "12px",
                      background: "#f4f7f2",
                      borderRadius: 10,
                    }}
                  >
                    <span>Stok saat ini</span>
                    <strong>
                      {restockModal.stock} {restockModal.unit}
                    </strong>
                  </div>
                  <label
                    style={{
                      display: "block",
                      fontSize: 11,
                      fontWeight: 800,
                      color: "#555",
                      marginBottom: 5,
                    }}
                  >
                    Tambah Stok ({restockModal.unit})
                  </label>
                  <input
                    style={{
                      ...S.inp,
                      marginBottom: 12,
                      fontSize: 16,
                      fontWeight: 700,
                    }}
                    type="number"
                    placeholder="Jumlah tambahan..."
                    value={restockQty}
                    onChange={(e) => setRestockQty(e.target.value)}
                    autoFocus
                  />
                  {restockQty && parseInt(restockQty) > 0 && (
                    <div
                      style={{
                        marginBottom: 12,
                        fontSize: 13,
                        color: "#2d7a2d",
                        fontWeight: 800,
                        padding: "10px 12px",
                        background: "#f0fdf4",
                        borderRadius: 10,
                      }}
                    >
                      ✅ Setelah restock:{" "}
                      <strong>
                        {restockModal.stock + parseInt(restockQty)}{" "}
                        {restockModal.unit}
                      </strong>
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 10 }}>
                    <button
                      style={{
                        ...btn("primary"),
                        flex: 1,
                        padding: 12,
                        fontSize: 14,
                      }}
                      onClick={doRestock}
                    >
                      ✅ Konfirmasi
                    </button>
                    <button
                      style={{ ...btn(), flex: 1, padding: 12, fontSize: 14 }}
                      onClick={() => setRestockModal(null)}
                    >
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* KONFIRMASI LOGOUT */}
            {showLogout && (
              <div style={S.overlay} onClick={() => setShowLogout(false)}>
                <div
                  style={{ ...S.modal, width: 340, textAlign: "center" }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div style={{ fontSize: 40, marginBottom: 12 }}>🚪</div>
                  <div
                    style={{
                      fontSize: 17,
                      fontWeight: 800,
                      color: "#1a4a1a",
                      marginBottom: 8,
                    }}
                  >
                    Keluar dari Sistem?
                  </div>
                  <div
                    style={{ fontSize: 13, color: "#888", marginBottom: 24 }}
                  >
                    Anda akan kembali ke halaman login.
                    <br />
                    Pastikan semua transaksi sudah disimpan.
                  </div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button
                      style={{
                        ...btn("danger"),
                        flex: 1,
                        padding: 12,
                        fontSize: 14,
                      }}
                      onClick={onLogout}
                    >
                      🚪 Ya, Keluar
                    </button>
                    <button
                      style={{ ...btn(), flex: 1, padding: 12, fontSize: 14 }}
                      onClick={() => setShowLogout(false)}
                    >
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            )}

            {notif && (
              <div
                style={{
                  position: "fixed",
                  top: 14,
                  right: 14,
                  zIndex: 9999,
                  padding: "12px 18px",
                  borderRadius: 12,
                  background: notif.type === "error" ? "#dc3545" : "#2d7a2d",
                  color: "#fff",
                  fontSize: 13,
                  fontWeight: 800,
                  boxShadow: "0 6px 20px rgba(0,0,0,0.25)",
                  animation: "fadeIn 0.2s ease",
                }}
              >
                {notif.msg}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
